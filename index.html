<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plánovač výroby</title>
<style>
:root{
  --bg:#eef1f5; --line:#d5dbe3; --line2:#e3e7ed; --text:#1d2733; --muted:#5f6b7a;
  --accent:#1f5fbf; --accent-soft:rgba(31,95,191,.16); --top:#1e2a38; --bad:#b42318;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font:13px/1.35 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--text);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.muted{color:var(--muted)}

/* top bar */
.topbar{display:flex;align-items:center;background:var(--top);color:#fff;height:44px;padding:0 12px;gap:14px;flex:none}
.brand{font-weight:700;letter-spacing:.03em;padding-right:16px;border-right:1px solid #34475d;white-space:nowrap}
.modnav{display:flex;align-self:stretch}
.modnav button{background:none;border:0;border-bottom:3px solid transparent;color:#aebdd0;padding:0 18px;font-weight:600;white-space:nowrap}
.modnav button:hover{color:#fff}
.modnav button.active{color:#fff;border-bottom-color:#5b9bff;background:#27384c}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.tbtn{background:#2b3c51;color:#e5ecf4;border:1px solid #3d536d;border-radius:3px;padding:5px 10px;white-space:nowrap}
.tbtn:hover{background:#34495f}
#saveState{font-size:12px;color:#9fb0c4;margin-right:4px;white-space:nowrap}
#saveState.err{color:#ff8a80;font-weight:700}
#clock{font-size:12px;color:#c9d4e2;white-space:nowrap;padding-right:10px;border-right:1px solid #34475d;margin-right:4px;font-variant-numeric:tabular-nums}

/* sheet tabs */
.sheetbar{display:flex;align-items:flex-end;gap:2px;padding:6px 12px 0;background:#dde3ea;border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.stab{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 12px;background:#eef1f5;border:1px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0;color:var(--muted);cursor:pointer;white-space:nowrap;user-select:none}
.stab:hover{background:#f6f8fa}
.stab.active{background:#fff;color:var(--text);font-weight:600;position:relative;top:1px;padding-bottom:6px}
.stab .cnt{font-size:11px;background:#dfe5ec;color:var(--muted);border-radius:8px;padding:0 6px;font-weight:600}
.stab .calb{font-size:10px;background:#2d6a4f;color:#fff;border-radius:2px;padding:0 4px;font-weight:700}
.stab .x{border:0;background:none;color:#8a96a5;padding:0 3px;font-size:15px;line-height:1}
.stab .x:hover{color:var(--bad)}
.stab input{width:170px;padding:1px 4px;border:1px solid var(--accent)}
.addtab{border:1px dashed #9fb0c4;background:transparent;color:var(--muted);border-radius:4px 4px 0 0;padding:5px 12px;margin-left:4px;border-bottom:0;white-space:nowrap}
.addtab:hover{background:#f6f8fa;color:var(--text)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:7px 12px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.btn{background:#f5f7f9;border:1px solid #c3cbd5;border-radius:3px;padding:4px 10px;white-space:nowrap}
.btn:hover:not(:disabled){background:#e7ecf1}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){background:#1a52a6}
.btn.danger{color:var(--bad)}
.btn.sm{padding:2px 8px;font-size:12px}
.btn:disabled{opacity:.4;cursor:default}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.spacer{flex:1}

/* panel */
.panel{background:#fff;border-bottom:1px solid var(--line);padding:8px 12px;flex:none}
.cap{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.kpi{display:flex;flex-direction:column;justify-content:center;gap:2px;border:1px solid var(--line);border-radius:3px;padding:5px 12px;min-width:150px;background:#fafbfc}
.kpi .l{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em;font-weight:600}
.kpi .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v.sm{font-size:15px}
.kpi .s{font-size:12px;color:var(--muted);white-space:nowrap}
.kpi input{font-size:17px;font-weight:700;width:90px;padding:1px 5px;border:1px solid #b9c3cf;border-radius:2px;background:#fff}
.kpi select{padding:3px 4px;border:1px solid #b9c3cf;border-radius:2px;background:#fff;font-weight:600}
.kpi.main{border-left:4px solid var(--accent)}
.kpi.filt{border-style:dashed}
.kpi.warn{border-left:4px solid var(--bad);background:#fff4f2}
.kpi.warn .v{color:var(--bad)}
.kpi.calk{border-left:4px solid #2d6a4f}
.shiftrow{display:flex;align-items:center;gap:10px;margin-top:8px}
.shifts{display:flex;flex-wrap:wrap;gap:3px;flex:1;max-height:84px;overflow:auto}
.sb{position:relative;width:72px;height:22px;border:1px solid #9fb0c4;background:#fff;font-size:11px;overflow:hidden}
.sb .f{position:absolute;left:0;top:0;bottom:0;background:#3a6cc0}
.sb.partial .f{background:#e3a72f}
.sb .t{position:relative;display:flex;justify-content:space-between;padding:0 4px;line-height:20px;font-weight:700;font-variant-numeric:tabular-nums}
.sb.full .t{color:#fff}
.sb2{position:relative;width:88px;height:34px;border:1px solid #b9c3cf;border-left:4px solid var(--c);background:#fff;font-size:11px;overflow:hidden}
.sb2 .f{position:absolute;left:0;top:0;bottom:0;background:var(--c);opacity:.28}
.sb2 .t{position:relative;padding:1px 5px;line-height:15px;font-variant-numeric:tabular-nums}
.sb2 .t b{display:block}
.sb2.cur{outline:2px solid var(--text);outline-offset:-1px}
.daygap{width:6px}
.legend{font-size:11px;color:var(--muted);white-space:nowrap}
.legend i{display:inline-block;width:10px;height:10px;vertical-align:-1px;margin:0 3px 0 8px}

/* grid */
.gridwrap{flex:1;overflow:auto;background:#fff;position:relative;scroll-padding-top:62px;scroll-padding-left:46px}
table.grid{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
.grid th,.grid td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0 6px;height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid thead th{position:sticky;top:0;z-index:3;background:#eef2f6;border-bottom:2px solid #b4bfcc;border-right-color:#d0d7e0;vertical-align:top;padding:5px 6px 6px;font-weight:600;text-align:left;height:auto}
.grid thead th.corner{cursor:pointer;background:#e2e8ef}
.grid thead th.corner:hover{background:#d5dde7}
.hwrap{display:flex;align-items:center;gap:4px}
.hl{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:1px 0}
.hl:hover{color:var(--accent)}
.th-num .hl{text-align:right}
.sortbtn{border:1px solid transparent;border-radius:2px;background:none;color:#8a96a5;padding:0 4px;font-size:11px;line-height:16px}
.sortbtn:hover{border-color:#b9c3cf;background:#fff}
.sortbtn.on{color:#fff;background:var(--accent)}
.fin{display:block;width:100%;margin-top:5px;font-weight:400;padding:2px 5px;border:1px solid #c3cbd5;border-radius:2px;background:#fff;height:24px}
.fin:focus{outline:2px solid var(--accent);outline-offset:-1px}
.fin.on{border-color:var(--accent);background:#e9f1ff;font-weight:600}
.grid tbody{user-select:none}
.grid th.rn{background:#f3f5f8;color:#7a8696;font-weight:400;font-size:11px;text-align:right;padding-right:6px;cursor:pointer;border-right:1px solid #cfd6df}
.grid th.rn:hover{background:#e3e9f0}
.grid th.rn.rsel{background:#d3e1f6;color:var(--text);font-weight:600}
.grid td{cursor:cell;background-clip:padding-box}
.grid td.num{text-align:right;font-variant-numeric:tabular-nums}
.grid td.c-calc{background-color:#f6f8fa;color:#2c3a4d}
.grid td.c-calc.num{font-weight:600}
.grid td.c-calc.bad{color:var(--bad);font-weight:700}
.grid tr.ghost th.rn{color:#b9c1cc}
.grid td.sel{background-image:linear-gradient(var(--accent-soft),var(--accent-soft))}
.grid td.act{box-shadow:inset 0 0 0 2px var(--accent)}
.grid td.invalid{color:var(--bad);text-decoration:underline dotted}
.grid td.editing{padding:0;overflow:visible;background-image:none}
.cell-input{display:block;width:100%;height:25px;border:0;outline:2px solid var(--accent);outline-offset:-2px;padding:0 6px;background:#fff;font-variant-numeric:tabular-nums}
.grid td.num .cell-input{text-align:right}

/* status bar */
.statusbar{display:flex;gap:18px;align-items:center;height:26px;padding:0 12px;background:#e7ebf0;border-top:1px solid var(--line);font-size:12px;flex:none;white-space:nowrap;overflow:hidden}
.statusbar .muted{font-size:11.5px}

/* misc */
#sink{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;resize:none;pointer-events:none}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#1e2a38;color:#fff;padding:8px 16px;border-radius:3px;z-index:60;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:80vw}
.modal{position:fixed;inset:0;background:rgba(20,30,45,.4);display:flex;align-items:flex-start;justify-content:center;z-index:40;padding-top:6vh}
.modal.wide{padding-top:2vh}
.mbox{background:#fff;width:min(760px,94vw);max-height:86vh;display:flex;flex-direction:column;border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal.wide .mbox{width:min(1500px,97vw);max-height:95vh}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px;background:#f3f5f8}
.mhead .x{border:0;background:none;font-size:20px;line-height:1;color:var(--muted)}
.mbody{padding:12px 14px;overflow:auto}
.mbody textarea{width:100%;font-family:Consolas,"Courier New",monospace;font-size:12px;border:1px solid #c3cbd5;padding:6px;white-space:pre;tab-size:12}
.mfoot{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.formrow{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:8px 0}
.formrow select,.formrow input[type=number],.formrow input[type=date]{padding:2px 4px;border:1px solid #c3cbd5;border-radius:2px}
.help h3,.sect h3{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.help h3:first-child,.sect h3:first-child{margin-top:0}
.sect h3 .n{display:inline-block;background:var(--top);color:#fff;border-radius:50%;width:18px;height:18px;text-align:center;line-height:18px;margin-right:6px;font-size:11px}
.sect h3 span.muted{text-transform:none;letter-spacing:0;font-weight:400}
.sect{border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:10px;overflow-x:auto;min-width:0}
.help table{border-collapse:collapse;width:100%}
.help td{border-bottom:1px solid var(--line2);padding:4px 6px;vertical-align:top}
.help td:first-child{white-space:nowrap;width:1%;font-weight:600}
kbd{display:inline-block;border:1px solid #b9c3cf;border-bottom-width:2px;border-radius:3px;padding:0 4px;font:11px Consolas,monospace;background:#f6f8fa}
code{background:#eef1f5;padding:0 3px;border-radius:2px}

/* rozpis směn */
.calhead{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-radius:4px;margin-bottom:10px;background:#f1f6f3;border:1px solid #bcd9c8}
.calhead.offm{background:#f6f6f6;border-color:var(--line)}
.calhead label{font-size:14px;display:flex;align-items:center;gap:8px;cursor:pointer}
.calhead input[type=checkbox]{width:18px;height:18px}
.ctypes{border-collapse:collapse}
.ctypes th{font-size:11px;text-transform:uppercase;color:var(--muted);text-align:left;padding:3px 6px;font-weight:600}
.ctypes td{padding:3px 6px;border-top:1px solid var(--line2);white-space:nowrap}
.ctypes input{padding:3px 5px;border:1px solid #c3cbd5;border-radius:2px;background:#fff}
.ctypes input[type=color]{width:34px;height:26px;padding:1px;cursor:pointer}
.ctypes .net{font-weight:700;font-variant-numeric:tabular-nums}
.ntag{display:inline-block;margin-left:8px;font-size:11px;background:#2d2a55;color:#fff;padding:1px 6px;border-radius:2px;font-weight:600}
.cweek{border-collapse:collapse}
.cweek th,.cweek td{padding:3px;text-align:center;border:1px solid var(--line2)}
.cweek thead th{font-size:12px;cursor:pointer;padding:4px 8px;background:#f3f5f8}
.cweek thead th:hover{background:#e3e9f0}
.cweek tbody th{text-align:left;padding:4px 10px;white-space:nowrap;font-weight:600}
.cweek tbody th small{font-weight:400;color:var(--muted);margin-left:6px}
.cweek .sum td,.cweek .sum th{font-size:11px;color:var(--muted);font-weight:600}
.wcell{width:50px;height:28px;border:1px dashed #b9c3cf;background:#fff;color:#b9c3cf;font-weight:700;border-radius:3px}
.wcell.on{background:var(--c);border:1px solid var(--c);color:#fff}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.calnav{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.calnav b{margin:0 8px;font-size:14px}
.cmonth{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cdow{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;padding:0 4px}
.cday{border:1px solid var(--line);border-radius:3px;padding:4px 5px;min-height:74px;background:#fff;display:flex;flex-direction:column;gap:4px;min-width:0}
.cday.we{background:#f7f8fa}
.cday.hol{background:#fff6e5}
.cday.past{opacity:.45}
.cday.today{border:2px solid var(--accent)}
.cday.ovr{box-shadow:inset 3px 0 0 #e3a72f}
.cdh{display:flex;align-items:center;gap:4px;font-size:12px;min-width:0}
.cdh .hn{font-size:10px;color:#9a5b00;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.cdh .sp{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.sc{border:1px dashed #b9c3cf;background:#fff;color:#a9b3bf;border-radius:3px;padding:1px 6px;font-size:11px;font-weight:700;min-width:30px}
.sc.on{background:var(--c);border:1px solid var(--c);color:#fff}
.sc.now{outline:2px solid #111;outline-offset:1px}
.cfoot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}
.mini{border:0;background:none;color:var(--accent);font-size:11px;padding:0 2px;cursor:pointer}
.mini:hover{text-decoration:underline}
.calcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(620px,1fr));gap:10px;align-items:start;margin-bottom:10px}
.calcols .sect{margin-bottom:0}
.ctypes input.tm{width:62px;text-align:center;font-variant-numeric:tabular-nums}

/* import */
.impsrc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop{border:2px dashed #b9c3cf;border-radius:4px;padding:14px;text-align:center;background:#fafbfc;display:flex;flex-direction:column;gap:8px;justify-content:center;align-items:center}
.drop.over{border-color:var(--accent);background:#eef4ff}
.impwrap{overflow:auto;max-height:44vh;border:1px solid var(--line);margin-top:6px}
.imptbl{border-collapse:separate;border-spacing:0;font-size:12px}
.imptbl th,.imptbl td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:3px 6px;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.imptbl thead th{position:sticky;top:0;background:#eef2f6;z-index:1;vertical-align:top;text-align:left;min-width:120px}
.imptbl thead th.rn{min-width:0}
.imptbl thead th select{width:100%;padding:2px;margin-bottom:3px;border:1px solid #b9c3cf;border-radius:2px;background:#fff;font-weight:600}
.imptbl thead th .hname{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.imptbl th.mapped,.imptbl td.mapped{background:#e3eefc}
.imptbl thead th.mapped{background:#cfe0f8}
.imptbl td.rn,.imptbl th.rn{color:#9aa5b3;text-align:right;background:#f6f8fa}
.imptbl tr.skip td{color:#b0b8c3;text-decoration:line-through}
.iinfo{padding:8px 10px;border-radius:3px;background:#f3f5f8;margin-top:8px}
.iinfo.bad{background:#fff4f2;color:var(--bad)}
.cfm{position:fixed;inset:0;background:rgba(20,30,45,.35);display:flex;align-items:flex-start;justify-content:center;padding-top:18vh;z-index:80}
.cbox{background:#fff;width:min(460px,92vw);border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.35);border-top:4px solid var(--accent)}
.cbox.danger{border-top-color:var(--bad)}
.cmsg{padding:16px 18px;font-size:14px;line-height:1.5}
.cbtns{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:#f6f8fa}
.btn.dfill{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.dfill:hover{background:#912018}

/* modul 1 – materiál a expedice */
:root{--ok-bg:#dcf2e2;--ok-rn:#bfe5ca;--ok-line:#2e7d4f;--nok-bg:#fbdede;--nok-rn:#f3c2c2;--nok-line:#c62828}
.sum{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;gap:8px;align-items:baseline;border:1px solid var(--line);padding:4px 12px;border-radius:3px;background:#fafbfc;cursor:pointer;user-select:none}
.chip b{font-size:16px;font-variant-numeric:tabular-nums}
.chip.ok{border-left:4px solid var(--ok-line)}
.chip.nok{border-left:4px solid var(--nok-line)}
.chip.empty{border-left:4px solid #9aa5b3}
.chip.on{outline:2px solid var(--accent);outline-offset:-1px;background:#eef4ff}
.hint{font-size:12px;color:var(--muted);margin-left:6px}
.grid td.c-status{text-align:center}
.grid tr.r-ok td{background-color:var(--ok-bg)}
.grid tr.r-nok td{background-color:var(--nok-bg)}
.grid tr.r-ok th.rn{background:var(--ok-rn);box-shadow:inset 4px 0 0 var(--ok-line);color:#22543a}
.grid tr.r-nok th.rn{background:var(--nok-rn);box-shadow:inset 4px 0 0 var(--nok-line);color:#7a1d1d}
.grid td.late{color:#a11010;font-weight:700}
.badge{display:inline-block;min-width:48px;text-align:center;padding:0 6px;border-radius:3px;font-weight:700;font-size:11.5px;line-height:18px;cursor:pointer;border:1px solid}
.badge.ok{background:var(--ok-line);border-color:var(--ok-line);color:#fff}
.badge.nok{background:var(--nok-line);border-color:var(--nok-line);color:#fff}
.badge.none{background:#fff;color:#8a96a5;border-color:#b9c3cf;border-style:dashed}

/* šířka sloupců */
.rz{position:absolute;top:0;right:0;width:7px;height:100%;cursor:col-resize;z-index:5}
.rz:hover{background:rgba(31,95,191,.35)}
body.resizing,body.resizing *{cursor:col-resize!important;user-select:none!important}

/* kontextové menu */
.ctxm{position:fixed;z-index:90;background:#fff;border:1px solid #b9c3cf;box-shadow:0 6px 22px rgba(0,0,0,.22);padding:4px 0;min-width:260px;border-radius:3px}
.ctxm button{display:flex;justify-content:space-between;align-items:center;gap:24px;width:100%;border:0;background:none;padding:5px 14px;text-align:left;white-space:nowrap}
.ctxm button:hover:not(:disabled){background:#e3eefc}
.ctxm button.dang{color:var(--bad);font-weight:600}
.ctxm button:disabled{color:#b0b8c3;cursor:default}
.ctxm kbd{font-size:10px;color:var(--muted)}
.ctxm .csep{height:1px;background:var(--line);margin:4px 0}

/* import – výběr záhlaví a řádků */
.impsteps{margin:6px 0 4px 18px;padding:0;color:var(--muted);font-size:12.5px}
.impsteps li{margin:2px 0}
.impsteps b{color:var(--text)}
.imptbl th.ck,.imptbl td.ck{width:30px;min-width:30px;text-align:center;padding:2px}
.imptbl td.hpick{cursor:pointer}
.imptbl td.hpick:hover{background:#ffe08a;color:#000;font-weight:700}
.imptbl tr.above td{color:#b5bcc6;background:#f7f7f7}
.imptbl tr.above td.mapped{background:#f0f2f5}
.imptbl tr.hdrrow td{background:#fff1c2!important;font-weight:700;color:#5a4300}
.imptbl tr.off td:not(.ck):not(.rn){color:#b0b8c3;text-decoration:line-through;background:#fafafa}

/* =====================================================================
   PLÁNOVÁNÍ DO SMĚN
   ===================================================================== */
function defaultDayIds(cal, date) {
  if (cal.skipHolidays && holidayName(date)) return [];
  return cal.pattern[date.getDay()] || [];
}
function dayIds(cal, date) {
  const ov = cal.overrides[dayKey(date)];
  return ov !== undefined ? ov : defaultDayIds(cal, date);
}
function dayTypes(cal, date) {
  const ids = dayIds(cal, date);
  return cal.types.filter(t => ids.includes(t.id)).sort((a, b) => hmToMin(a.start) - hmToMin(b.start));
}
function shiftBounds(t, day) {
  const s = hmToMin(t.start), e = hmToMin(t.end);
  const start = new Date(day.getFullYear(), day.getMonth(), day.getDate(), Math.floor(s / 60), s % 60).getTime();
  let end = new Date(day.getFullYear(), day.getMonth(), day.getDate() + (e <= s ? 1 : 0), Math.floor(e / 60), e % 60).getTime();
  if (end <= start) end = start + 86400000;
  return { start, end };
}
/** Generátor směn od daného okamžiku. mode: now = jen zbytek aktuální směny, start = celá aktuální, next = až od příští */
function* slotsFrom(cal, fromTs, mode) {
  const d0 = addDays(new Date(fromTs), -1);
  for (let i = 0; i < 1100; i++) {
    const day = addDays(new Date(d0.getFullYear(), d0.getMonth(), d0.getDate()), i);
    for (const t of dayTypes(cal, day)) {
      const { start, end } = shiftBounds(t, day);
      if (end <= fromTs) continue;
      const net = typeNet(t);
      if (net <= 0) continue;
      const current = start <= fromTs;
      let cap = net, wstart = start;
      if (current) {
        if (mode === 'next') continue;
        if (mode === 'now') { cap = net * (end - fromTs) / (end - start); wstart = fromTs; }
      }
      if (cap <= 0.01) continue;
      yield { t, day, start, end, wstart, cap, current };
    }
  }
}
function slotLabel(s) { return `${DOW[s.day.getDay()]} ${fmtD(s.day)} ${s.t.short || s.t.name}`; }
function slotTime(s, used) { return s.wstart + (s.cap ? used / s.cap : 0) * (s.end - s.wstart); }

function planWithCalendar(sh, now) {
  const cal = sh.cal, it = slotsFrom(cal, now, cal.planFrom);
  const slots = [];
  const next = () => { const n = it.next(); if (n.done) return null; const s = Object.assign({ used: 0 }, n.value); slots.push(s); return s; };
  let cur = next();
  const plan = new Map(); let T = 0, finish = null, unplanned = 0;
  for (const row of sh.rows) {
    const t = orderTotal(row);
    if (!(t > 0)) continue;
    T += t;
    while (cur && cur.cap - cur.used <= 1e-6) cur = next();
    if (!cur) { plan.set(row.id, { label: 'nevejde se do rozpisu', bad: true }); unplanned += t; continue; }
    const first = cur;
    let need = t;
    while (need > 1e-9) {
      const take = Math.min(need, cur.cap - cur.used);
      cur.used += take; need -= take;
      if (need > 1e-9) { const n = next(); if (!n) break; cur = n; }
    }
    if (need > 1e-9) { plan.set(row.id, { label: slotLabel(first) + ' → nevejde se', bad: true }); unplanned += need; continue; }
    const endTs = slotTime(cur, cur.used);
    plan.set(row.id, { label: first === cur ? slotLabel(first) : `${slotLabel(first)} → ${slotLabel(cur)}`, endLabel: fmtDT(endTs), endTs });
    finish = endTs;
  }
  return { plan, slots: slots.filter(s => s.used > 1e-6), T: round3(T), finish, unplanned: round3(unplanned) };
}
function currentShiftInfo(cal, now) {

}
function buildCtx() {
  const sh = sheet(), now = Date.now();

  if (ui.module === 'm1') return cx;
  if (calOn(sh)) {
    const r = planWithCalendar(sh, now);
    cx.plan = r.plan; cx.sum = r;
  } else {
    const S = sh.shift > 0 ? sh.shift : DEFAULT_SHIFT;
    let cum = 0;
    for (const row of sh.rows) {
      const t = orderTotal(row);
      if (!(t > 0)) continue;
      const a = cum, b = cum + t;
      const s1 = Math.floor(a / S + 1e-9) + 1, s2 = Math.max(s1, Math.ceil(b / S - 1e-9));
      cx.plan.set(row.id, { label: s1 === s2 ? `${s1}. směna` : `${s1}.–${s2}. směna` });
      cum = b;
    }
  }
  return cx;
}

/* =====================================================================
   FILTRY A ŘAZENÍ
   ===================================================================== */
function matchFilter(col, row, f) {
  if (f == null || f === '') return true;
  if (col.type === 'status') { const v = row[col.key] || ''; return f === '__empty' ? !v : v === f; }
  f = String(f).trim();
  if (!f) return true;
  const raw = rawOf(col, row);
  const empty = raw == null || raw === '';
  if (f === '=') return empty;
  if (f === '!=' || f === '<>' || f === '!') return !empty;
  const m = f.match(/^(>=|<=|<>|!=|>|<|=)\s*(.+)$/);
  if (m) {
    let a, b;
    if (col.type === 'date') { b = parseDate(normDate(m[2])); a = empty ? null : parseDate(String(raw)); if (b == null) b = NaN; }
    else { b = parseNum(m[2]); a = empty ? null : numVal(raw); }
    if (!isNaN(b)) {
      if (a == null || isNaN(a)) return false;
      switch (m[1]) {
        case '>': return a > b; case '<': return a < b; case '>=': return a >= b; case '<=': return a <= b;
        case '=': return a === b; default: return a !== b;
      }
    }
    if (isNumericCol(col) || col.type === 'date') return true;
  }
  const text = normText(isNum(raw) ? `${raw} ${copyNum(raw)}` : String(raw ?? ''));
  const parts = s => s.split(';').map(p => normText(p.trim())).filter(Boolean);
  if (f.startsWith('!')) return !parts(f.slice(1)).some(p => text.includes(p));
  if (f.startsWith('=')) { const t = normText(String(raw ?? '')); return parts(f.slice(1)).some(p => t === p); }
  const ps = parts(f);
  return !ps.length || ps.some(p => text.includes(p));
}
function sortKey(col, raw) {
  if (raw == null || raw === '') return { e: 1, t: 0, v: 0 };
  if (col.type === 'date') { const d = parseDate(String(raw)); return d != null ? { e: 0, t: 0, v: d } : { e: 0, t: 1, v: String(raw) }; }
  if (isNumericCol(col)) { const n = numVal(raw); if (isNum(n)) return { e: 0, t: 0, v: n }; }
  return { e: 0, t: 1, v: String(raw) };
}
function sortRows(rows, col, dir) {
  const k = dir === 'desc' ? -1 : 1;
  return rows.map((row, i) => ({ row, i, s: sortKey(col, rawOf(col, row)) }))
    .sort((a, b) => {
      const x = a.s, y = b.s;
      if (x.e !== y.e) return x.e - y.e;
      if (x.t !== y.t) return (x.t - y.t) * k;
      const c = x.t === 0 ? x.v - y.v : collator.compare(x.v, y.v);
      return c ? c * k : a.i - b.i;
    }).map(o => o.row);
}

  ctx = buildCtx();
  let rows = sh.rows.filter(r => cs.every(c => matchFilter(c, r, sh.filters[c.key])));
  if (sh.sort) { const col = cs.find(c => c.key === sh.sort.key); if (col) rows = sortRows(rows, col, sh.sort.dir); }
  viewIds = rows.map(r => r.id);
}

function setText(id, v) { const el = $(id); if (el) el.textContent = v; }

function updatePanel() {
  const sh = sheet();

  setText('#shiftLenH', fmtHM(S));
  const sh2 = Math.round(shifts * 100) / 100;
  setText('#cShifts', `${fmtNum(sh2)} ${plural(sh2, 'směnu', 'směny', 'směn')}`);
  setText('#cShiftsS', `plně vykryto: ${full} ${plural(full, 'směna', 'směny', 'směn')}`);
  if (T <= 0) { setText('#cLast', '—'); setText('#cLastS', 'žádná práce'); }
  else if (rem > 0) {

}

function askConfirm(msg, opts = {}) {
  return new Promise(res => {
    const o = document.createElement('div');
    o.className = 'cfm';
    o.innerHTML = `<div class="cbox${opts.danger ? ' danger' : ''}"><div class="cmsg">${esc(msg).replace(/\n/g, '<br>')}</div>
      <div class="cbtns">${opts.alert ? '' : `<button class="btn" data-n>${esc(opts.cancel || 'Zrušit')}</button>`}
      <button class="btn ${opts.danger ? 'dfill' : 'primary'}" data-y>${esc(opts.ok || (opts.alert ? 'OK' : 'Ano'))}</button></div></div>`;
    document.body.appendChild(o);
    const prevFocus = document.activeElement;
    const done = v => {
      o.remove(); document.removeEventListener('keydown', key, true);
      if (prevFocus && prevFocus.focus && document.contains(prevFocus)) prevFocus.focus({ preventScroll: true });
      res(v);
    };
    const key = e => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); done(!!opts.alert); }
      else if (e.key === 'Enter') { e.preventDefault(); e.stopImmediatePropagation(); done(true); }
    };
    document.addEventListener('keydown', key, true);
    o.addEventListener('mousedown', e => { if (e.target === o) done(!!opts.alert); });
    o.querySelector('[data-y]').onclick = () => done(true);
    const n = o.querySelector('[data-n]'); if (n) n.onclick = () => done(false);
    setTimeout(() => o.querySelector('[data-y]').focus(), 0);
  });
}

    const u8 = new Uint8Array(buf.slice(0, 8));
    const isZip = u8[0] === 0x50 && u8[1] === 0x4B;
    const isOle = u8[0] === 0xD0 && u8[1] === 0xCF && u8[2] === 0x11 && u8[3] === 0xE0;
    if (isOle) {
      impMsg('Starý formát Excelu <b>.xls (97–2003)</b> neumím přečíst. V Excelu ho prosím uložte jako <b>.xlsx</b> (Soubor → Uložit jako), nebo data zkopírujte a vložte do pole vpravo.', true);
      return;
    }
    imp.sheets = isZip ? await readXlsx(buf) : [{ name: file.name, rows: parseTextAuto(decodeText(buf)) }];
    impMsg('');
    $('#impText').value = '';
    const first = Math.max(0, imp.sheets.findIndex(s => s.rows.length));
    setImportSheet(first);

    if (score > bestScore) { bestScore = score; best = i + 1; }

  if (bestScore >= 1) return best;

  if (rows.length > 1) {
    const r0 = rows[0], r1 = rows[1];
    const isN = v => isNum(v) || (String(v ?? '').trim() !== '' && !isNaN(parseNum(v)));
    const numCols = r1.map((v, j) => isN(v) ? j : -1).filter(j => j >= 0);

  const used = new Set();
  if (imp.headerRow > 0) {
    for (let j = 0; j < w; j++) {
      const k = headerKey(hdr[j]);
      if (!k) continue;
      const m = mem[k];
      let f = m ? m.f : guessField(hdr[j]);
      if (f && used.has(f)) f = '';
      imp.map[j] = f || '';
      if (f) used.add(f);
      imp.units[j] = (m && m.u) || guessUnit(hdr[j]);

}

    <tr><td>Pravé tlačítko myši</td><td>na buňkách / číslech řádků: kopírovat, vložit, <b>vložit řádek nad / pod, odstranit řádky</b>, vymazat obsah, odstranit všechny prázdné řádky (v modulu 1 i OK / NOK).
      Na názvu sloupce: řazení, výběr / kopírování sloupce, šířky sloupců.</td></tr>
    <tr><td>Šířka sloupce</td><td>táhněte za pravý okraj názvu sloupce · dvojklik na okraj = podle obsahu · obnovit výchozí: pravé tlačítko na názvu sloupce. Šířky si každý modul pamatuje.</td></tr>
  </table>
  <h3>Import z Excelu / SAP</h3>
  <p>Tlačítko <b>Import z Excelu / SAP…</b> nebo přetažení souboru do okna. Umí .xlsx, .csv, .txt (i SAP export s oddělovači | ) a SAP „.xls“ uložené jako text.
  V náhledu kliknete na číslo řádku, kde jsou názvy sloupců (např. 3. řádek u exportu ze SAPu), zaškrtnutím vyberete řádky k importu
  (Shift+klik = rozsah) a nad každým sloupcem zvolíte, kam patří, a u časů i jednotku (minuty / sekundy / hodiny / Excel čas). Aplikace si přiřazení pamatuje podle názvu sloupce,
  takže příště se nastaví samo (každý modul si pamatuje svá přiřazení). Starý binární .xls (97–2003) je třeba v Excelu uložit jako .xlsx.
  V modulu Materiál a expedice se při importu rozpozná OK / NOK / ano / ne / 1 / 0 a data z Excelu se převedou na DD.MM.RRRR.</p>
  <h3>Materiál a expedice</h3>
  <p>Klik na štítek ve sloupci Materiál přepíná OK ↔ NOK; klávesa <kbd>O</kbd> nastaví OK, <kbd>N</kbd> nastaví NOK, <kbd>Delete</kbd> vymaže – vždy pro celý výběr.
  Řádek s NOK je červený, s OK zelený. Uplynulé termíny odeslání jsou zvýrazněny tučně červeně. Ukazatele nad tabulkou fungují jako rychlý filtr.</p>
  <h3>Rozpis směn (Plán výroby)</h3>
  <p>Tlačítko <b>Rozpis směn…</b> – pro každé pracoviště zvlášť:</p>
  <table>
    <tr><td>1. Směny</td><td>začátek, konec a přestávky. Konec dřív než začátek (22:00–6:00) = noční směna, končí další den.</td></tr>
    <tr><td>2. Běžný týden</td><td>které směny jedou v který den; opakuje se každý týden. Noční patří ke dni, kdy začíná.</td></tr>
    <tr><td>3. Kalendář</td><td>výjimky pro konkrétní dny – klik na směnu ji zapne/vypne (přesčas v sobotu, dovolená, odstávka). Svátky se vyznačí automaticky.</td></tr>
    <tr><td>4. Hromadně</td><td>pro celé období nastavit vybrané směny, volno, nebo vrátit na běžný týden; převzetí rozpisu z jiného pracoviště.</td></tr>
  </table>
  <p>Když je rozpis zapnutý, zakázky se rozplánují v pořadí řádků do konkrétních směn od <b>aktuálního data a času</b>: sloupec <b>Směna</b> ukazuje
  např. „St 12.11. R → Čt 13.11. O“ a <b>Konec (odhad)</b> čas dokončení. „Plánovat od“ určuje, zda se počítá jen se zbytkem aktuální směny,
  s celou aktuální směnou, nebo až od příští. Přepočet probíhá každou minutu. Vypnutý rozpis = výpočet s pevnou délkou směny.</p>
  <h3>Filtry (pole pod názvem sloupce)</h3>
  <table>
    <tr><td><code>abc</code> / <code>abc;def</code></td><td>obsahuje text / kterýkoli z výrazů</td></tr>
    <tr><td><code>!abc</code> / <code>=abc</code></td><td>neobsahuje / přesná shoda</td></tr>
    <tr><td><code>=</code> / <code>!=</code></td><td>prázdné / neprázdné buňky</td></tr>
    <tr><td><code>&gt;100</code>, <code>&lt;=5</code></td><td>porovnání čísel</td></tr>
    <tr><td><code>12.11.</code> ve sloupci Směna</td><td>zakázky naplánované na daný den</td></tr>
  </table>
  <h3>Ukládání dat</h3>
  <p>Každá změna se okamžitě uloží do úložiště prohlížeče v tomto počítači. Nepoužívejte anonymní režim a nemažte data prohlížeče.
  <b>Pravidelně si stahujte zálohu</b> (tlačítko nahoře) – obsahuje i rozpisy směn a zapamatovaná přiřazení sloupců.</p>
  </div>`, [{ label: 'Zavřít', primary: true }]);
}

/* =====================================================================
   UDÁLOSTI
   ===================================================================== */
const actions = {
  addRow, insRow: insertRow, delRows: deleteRows, up: () => moveRows(-1), down: () => moveRows(1),
  undo, redo, import: () => openImport(), copyAll, clearFilters, applySort, clearSheet, cal: openCalendar,
};
$('#toolbar').addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
$('#toolbar').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  commitIfEditing();
  actions[b.dataset.act]();
  if ($('#modal').hidden && b.dataset.act !== 'clearSheet') focusSink();
});

$('#sheetbar').addEventListener('click', e => {
  const del = e.target.closest('[data-del]'); if (del) { e.stopPropagation(); deleteSheet(del.dataset.del); return; }
  if (e.target.closest('#addSheet')) { addSheet(); return; }
  const tab = e.target.closest('.stab'); if (tab) switchSheet(tab.dataset.sid);
});
$('#sheetbar').addEventListener('dblclick', e => {
  const tab = e.target.closest('.stab'); if (tab && !e.target.closest('[data-del]')) startRename(tab.dataset.sid);
});

$('#modnav').addEventListener('click', e => { const b = e.target.closest('[data-mod]'); if (b) switchModule(b.dataset.mod); });
$('#panel').addEventListener('click', e => {
  if (e.target.closest('[data-opencal]')) { commitIfEditing(); openCalendar(); return; }
  const ch = e.target.closest('.chip'); if (!ch || ui.module !== 'm1') return;
  const sh = sheet(), f = ch.dataset.f;
  if (!f || sh.filters.mat === f) delete sh.filters.mat; else sh.filters.mat = f;
  save(); recomputeView(); renderGrid(); updatePanel(); updateStatus();
});
$('#panel').addEventListener('input', e => {
  if (e.target.id !== 'shiftLen') return;
  const v = parseNum(e.target.value);
  if (!(v > 0)) return;
  sheet().shift = v; save(); ctx = buildCtx(); refreshGlobalCalc(); updatePanel();
});
$('#panel').addEventListener('change', e => {
  if (e.target.id !== 'planFrom') return;
  sheet().cal.planFrom = e.target.value; save(); ctx = buildCtx(); refreshGlobalCalc(); updatePanel();
});

/* --- mřížka: myš --- */
grid.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  const t = e.target;
  const rz = t.closest('.rz');
  if (rz) { e.preventDefault(); e.stopPropagation(); commitIfEditing(); startResize(+rz.dataset.rz, e.clientX); return; }
  if (t.closest('.fin') || t.closest('.cell-input')) return;
  const sb = t.closest('.sortbtn');
  if (sb) { e.preventDefault(); commitIfEditing(); toggleSort(+sb.dataset.sc); return; }
  const hl = t.closest('.hl');
  if (hl) { e.preventDefault(); commitIfEditing(); selectCol(+hl.dataset.cc, e.shiftKey); drag = { mode: 'col' }; focusSink(); return; }
  if (t.closest('.corner')) { e.preventDefault(); commitIfEditing(); selectAll(); focusSink(); return; }
  const rn = t.closest('th.rn');
  if (rn) { e.preventDefault(); commitIfEditing(); selectRow(+rn.parentNode.dataset.r, e.shiftKey); drag = { mode: 'row' }; focusSink(); return; }
  const td = t.closest('td'); if (!td) return;
  e.preventDefault();
  const r = +td.parentNode.dataset.r, c = +td.dataset.c;
  if (editing) { if (editing.r === r && editing.c === c) return; commitEdit(); }
  const wasAct = sel && sel.ar === r && sel.ac === c && sel.er === r && sel.ec === c;
  if (e.shiftKey && sel) { sel.er = r; sel.ec = c; paintSel(); updateStatus(); }
  else setSel(r, c);
  focusSink();
  if (t.closest('.badge') && !e.shiftKey) { toggleStatusAt(r, c); return; }
  drag = { mode: 'cell' };
  pendingEdit = wasAct && !e.shiftKey ? { r, c } : null;
});
grid.addEventListener('mouseover', e => {
  if (!drag || !sel) return;
  const td = e.target.closest('td'), rn = e.target.closest('th.rn'), hl = e.target.closest('.hl');
  if (drag.mode === 'cell' && td) {
    const r = +td.parentNode.dataset.r, c = +td.dataset.c;
    if (sel.er !== r || sel.ec !== c) { sel.er = r; sel.ec = c; pendingEdit = null; paintSel(); updateStatus(); }
  } else if (drag.mode === 'row' && (td || rn)) {
    const r = +(td || rn).parentNode.dataset.r;
    if (sel.er !== r) { sel.er = r; paintSel(); updateStatus(); }
  } else if (drag.mode === 'col' && hl) {
    const c = +hl.dataset.cc;
    if (sel.ec !== c) { sel.ec = c; paintSel(); updateStatus(); }
  }
});
document.addEventListener('mouseup', e => {
  if (pendingEdit) {
    const td = e.target.closest && e.target.closest('td');
    if (td && grid.contains(td) && +td.parentNode.dataset.r === pendingEdit.r && +td.dataset.c === pendingEdit.c) startEdit(pendingEdit.r, pendingEdit.c);
  }
  pendingEdit = null; drag = null;
});
grid.addEventListener('contextmenu', e => {
  const t = e.target;
  if (t.closest('.fin') || t.closest('.cell-input')) return;   // u polí s textem nechat menu prohlížeče
  const th = t.closest('thead th');
  if (th) {
    e.preventDefault(); commitIfEditing();
    const hl = th.querySelector('.hl');
    if (hl) headerMenu(e.clientX, e.clientY, +hl.dataset.cc);
    else openCtx(e.clientX, e.clientY, [
      { label: 'Vybrat vše', kbd: 'Ctrl+A', action: () => { selectAll(); focusSink(); } },
      { label: 'Přizpůsobit šířku všech sloupců', action: () => cols().forEach((_, k) => autoFitCol(k)) },
      { label: 'Obnovit výchozí šířky sloupců', disabled: !ui.widths[ui.module], action: resetWidths }]);
    return;
  }
  const td = t.closest('td'), rn = t.closest('th.rn');
  if (!td && !rn) return;
  e.preventDefault(); commitIfEditing();
  const r = +(td || rn).parentNode.dataset.r;
  if (rn) {
    const R = sel ? range() : null;
    if (!(R && r >= R.r1 && r <= R.r2 && R.c1 === 0 && R.c2 === cols().length - 1)) selectRow(r, false);
  } else if (!inSel(r, +td.dataset.c)) setSel(r, +td.dataset.c);
  focusSink();
  rowMenu(e.clientX, e.clientY);
});
gridwrap.addEventListener('scroll', closeCtx);
window.addEventListener('blur', closeCtx);
window.addEventListener('resize', () => { closeCtx(); });
grid.addEventListener('dblclick', e => {
  const rz = e.target.closest('.rz');
  if (rz) { e.preventDefault(); autoFitCol(+rz.dataset.rz); return; }
  const td = e.target.closest('td');
  if (!td || e.target.closest('.cell-input')) return;
  if (cols()[+td.dataset.c].type === 'status') return;
  if (!editing) startEdit(+td.parentNode.dataset.r, +td.dataset.c);
});

/* --- filtry --- */
let filterT;
grid.addEventListener('input', e => {
  const f = e.target.closest('.fin'); if (!f) return;
  f.classList.toggle('on', !!f.value);
  clearTimeout(filterT);
  const i = +f.dataset.fc, v = f.value;
  filterT = setTimeout(() => setFilter(i, v), 120);
});
grid.addEventListener('keydown', e => {
  const f = e.target.closest('.fin'); if (!f) return;
  if (e.key === 'Enter' || e.key === 'ArrowDown') { e.preventDefault(); clearTimeout(filterT); setFilter(+f.dataset.fc, f.value); setSel(0, +f.dataset.fc); focusSink(); }
  else if (e.key === 'Escape') { f.value = ''; f.classList.remove('on'); setFilter(+f.dataset.fc, ''); }
});

/* --- klávesnice --- */
sink.addEventListener('keydown', e => {
  const k = e.key, lk = k.length === 1 ? k.toLowerCase() : k, ctrl = e.ctrlKey || e.metaKey;
  if (!sel) setSel(0, 0);
  if (ctrl) {
    if (lk === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (lk === 'y') { e.preventDefault(); redo(); return; }
    if (lk === 'a') { e.preventDefault(); selectAll(); return; }
    if (k === '-' || k === 'Subtract') { e.preventDefault(); deleteRows(); return; }
    if ((k === '+' || k === 'Add') && e.shiftKey) { e.preventDefault(); insertRow(); return; }
    if (k.startsWith('Arrow')) {
      e.preventDefault();
      moveSel(k === 'ArrowUp' ? -1 : k === 'ArrowDown' ? 1 : 0, k === 'ArrowLeft' ? -1 : k === 'ArrowRight' ? 1 : 0, e.shiftKey, true);
      return;
    }
    if (k === 'Home') { e.preventDefault(); setSel(0, 0); scrollCell(0, 0); return; }
    if (k === 'End') { e.preventDefault(); const r = lastReal(), c = cols().length - 1; setSel(r, c); scrollCell(r, c); return; }
    return;
  }
  if (e.altKey && (k === 'ArrowUp' || k === 'ArrowDown')) { e.preventDefault(); moveRows(k === 'ArrowUp' ? -1 : 1); return; }
  switch (k) {
    case 'ArrowUp': e.preventDefault(); moveSel(-1, 0, e.shiftKey); return;
    case 'ArrowDown': e.preventDefault(); moveSel(1, 0, e.shiftKey); return;
    case 'ArrowLeft': e.preventDefault(); moveSel(0, -1, e.shiftKey); return;
    case 'ArrowRight': e.preventDefault(); moveSel(0, 1, e.shiftKey); return;
    case 'PageDown': e.preventDefault(); moveSel(20, 0, e.shiftKey); return;
    case 'PageUp': e.preventDefault(); moveSel(-20, 0, e.shiftKey); return;
    case 'Home': e.preventDefault(); moveSel(0, -99, e.shiftKey); return;
    case 'End': e.preventDefault(); moveSel(0, 99, e.shiftKey); return;
    case 'Tab': e.preventDefault(); moveSel(0, e.shiftKey ? -1 : 1); return;
    case 'Enter': e.preventDefault(); if (e.shiftKey) moveSel(-1, 0); else startEdit(sel.ar, sel.ac); return;
    case 'F2': e.preventDefault(); startEdit(sel.ar, sel.ac); return;
    case 'Delete': case 'Backspace': e.preventDefault(); clearSelection(); return;
    case 'Escape': e.preventDefault(); setSel(sel.ar, sel.ac); return;
  }
  if (k.length === 1 && !e.altKey) {
    e.preventDefault();
    const ct = cols()[sel.ac].type;
    if (ct === 'status') {
      if (lk === 'o' || lk === 'a' || lk === '1') setStatusSel('OK');
      else if (lk === 'n' || lk === '0') setStatusSel('NOK');
      else if (k === ' ') toggleStatusAt(sel.ar, sel.ac);
      return;
    }
    if (ct === 'calc') { toast('Tento sloupec se počítá automaticky.'); return; }
    startEdit(sel.ar, sel.ac, k);
  }
});
sink.addEventListener('copy', e => {
  if (!sel) return;
  e.preventDefault(); e.clipboardData.setData('text/plain', selectionTSV());
  const R = range(); toast(`Zkopírováno ${R.r2 - R.r1 + 1} × ${R.c2 - R.c1 + 1}.`);
});
sink.addEventListener('cut', e => {
  if (!sel) return;
  e.preventDefault(); e.clipboardData.setData('text/plain', selectionTSV()); clearSelection();
});
sink.addEventListener('paste', e => {
  e.preventDefault();
  pasteGrid(parseTSV(e.clipboardData ? e.clipboardData.getData('text/plain') : ''));
});

/* --- globální --- */
document.addEventListener('keydown', e => {
  if (e.key === 'F1') { e.preventDefault(); openHelp(); return; }
  if (e.key === 'Escape' && $('#ctxm')) { e.preventDefault(); closeCtx(); return; }
  if (e.key === 'Escape' && !$('#modal').hidden) closeModal();
});
$('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal' && modalKind !== 'import' && modalKind !== 'cal') closeModal(); });
$('#btnHelp').onclick = openHelp;
$('#btnExport').onclick = exportBackup;
$('#btnImport').onclick = () => { $('#fileImport').value = ''; $('#fileImport').click(); };
$('#fileImport').onchange = e => { const f = e.target.files[0]; if (f) importBackup(f); };
gridwrap.addEventListener('mousedown', e => { if (e.target === gridwrap) { commitIfEditing(); focusSink(); } });

// přetažení souboru kamkoli do okna = import
window.addEventListener('dragover', e => { if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) e.preventDefault(); });
window.addEventListener('drop', e => {
  const f = e.dataTransfer && e.dataTransfer.files[0];
  if (!f) return;
  e.preventDefault();
  if (/\.json$/i.test(f.name)) { importBackup(f); return; }
  if (modalKind === 'import') loadImportFile(f); else { closeModal(); openImport(f); }
});

window.addEventListener('beforeunload', () => commitIfEditing());
document.addEventListener('visibilitychange', () => { if (document.hidden) commitIfEditing(); else tick(); });
window.addEventListener('storage', e => {
  const k = e.key === KEYS.m1 ? 'm1' : e.key === KEYS.m2 ? 'm2' : '';
  if (!k) return;
  const d = normalizeData(k, safeParse(e.newValue));
  if (!d) return;
  store[k] = d;
  if (k !== ui.module) return;
  data = d; editing = null;
  if ($('#modal').hidden) { renderAll(); toast('Data byla změněna v jiném okně – zobrazena aktuální verze.'); }
});

// hodiny + přepočet plánu podle aktuálního času
function tick() {
  const d = new Date();
  $('#clock').textContent = `${DOW[d.getDay()]} ${d.toLocaleDateString('cs-CZ')} ${d.getHours()}:${pad2(d.getMinutes())}`;
  if (calOn(sheet()) && !editing) { ctx = buildCtx(); refreshGlobalCalc(); updatePanel(); }
}
setInterval(tick, 60000);

/* =====================================================================
   START
   ===================================================================== */
renderAll();
setSel(0, 0);
focusSink();
tick();
window.__planovac = { get data() { return data; }, store, switchModule, parseNum, parseTextAuto, planWithCalendar, readXlsx, holidayName, buildCtx: () => buildCtx() };
})();
</script>
</body>
</html>
